version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "06:00"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
    assignees:
      - "SamJUK"
  # PHP patch releases for the pinned base images, one directory per PHP minor
  - package-ecosystem: "docker"
    directories:
      - "/src/php/*"
    schedule:
      interval: "daily"
      time: "06:00"
    ignore:
      - dependency-name: "php"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      all-docker:
        patterns:
          - "*"
    assignees:
      - "SamJUK"
