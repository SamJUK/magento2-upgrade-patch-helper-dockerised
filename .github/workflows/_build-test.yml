name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php_version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned PHP image
        id: pin
        run: echo "image=$(sed -n 's/^FROM //p' "src/php/${PHP_VERSION}/Dockerfile")" >> "$GITHUB_OUTPUT"
        env:
          PHP_VERSION: ${{ matrix.php_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cache Composer downloads for the Mage-OS fixture
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.cache/composer
          key: composer-mageos-${{ hashFiles('tests/e2e.sh') }}
          restore-keys: composer-mageos-

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          load: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            PHP_IMAGE=${{ steps.pin.outputs.image }}
          tags: upgrade-patch-helper-test:${{ matrix.php_version }}
          cache-from: type=gha,scope=php-${{ matrix.php_version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_version }}-${{ matrix.arch }}

      - name: Smoke test
        run: IMAGE_REF=upgrade-patch-helper-test:${{ matrix.php_version }} bash tests/smoke.sh

      - name: E2E tests
        run: IMAGE_REF=upgrade-patch-helper-test:${{ matrix.php_version }} bash tests/e2e.sh
