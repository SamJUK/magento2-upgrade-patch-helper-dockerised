name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up PHP + Composer (for E2E fixture creation)
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php_version }}-${{ hashFiles('tests/fixtures/root-composer.json') }}
          restore-keys: composer-${{ matrix.php_version }}-${{ hashFiles('tests/fixtures/root-composer.json') }}
          lookup-only: true

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: src
          load: true
          build-args: PHP_VERSION=${{ matrix.php_version }}
          tags: upgrade-patch-helper-test:${{ matrix.php_version }}
          cache-from: type=gha,scope=php-${{ matrix.php_version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_version }}

      - name: Smoke test
        run: IMAGE_REF=upgrade-patch-helper-test:${{ matrix.php_version }} bash tests/smoke.sh

      - name: E2E tests
        run: IMAGE_REF=upgrade-patch-helper-test:${{ matrix.php_version }} bash tests/e2e.sh
