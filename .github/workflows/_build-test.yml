name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up PHP + Composer (for E2E fixture creation)
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php_version }}-${{ hashFiles('tests/fixtures/root-composer.json') }}
          restore-keys: composer-${{ matrix.php_version }}-${{ hashFiles('tests/fixtures/root-composer.json') }}
          lookup-only: true

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src
          load: true
          build-args: PHP_VERSION=${{ matrix.php_version }}
          tags: upgrade-patch-helper-test:${{ matrix.php_version }}
          cache-from: type=gha,scope=php-${{ matrix.php_version }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_version }}

      - name: Smoke test
        run: IMAGE_REF=upgrade-patch-helper-test:${{ matrix.php_version }} bash tests/smoke.sh

      - name: E2E tests
        run: IMAGE_REF=upgrade-patch-helper-test:${{ matrix.php_version }} bash tests/e2e.sh
